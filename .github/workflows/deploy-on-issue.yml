name: Deploy on Issue Change

on:
  issues:
    types: [opened, edited, deleted, labeled, unlabeled]

jobs:
  trigger-deploy:
    # Only run when the issue contains the 'thoughts' label
    if: contains(github.event.issue.labels.*.name, 'thoughts')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy Hook
        run: |
          curl -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
